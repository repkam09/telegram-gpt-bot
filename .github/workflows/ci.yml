name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests that touch Prisma create their own temp databases; this is only a default for Config.
      DATABASE_URL: "file:./ci.sqlite"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc sets ignore-scripts=true, so Prisma's generate step must be run explicitly.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      # Deliberately not `npm run lint`, which uses `eslint --fix` and would hide problems in CI.
      # Use npm scripts (not npx) so only the locked, locally installed tool versions are ever run.
      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run tsc:noemit

      # tsconfig.json excludes tests, so they get their own type check.
      - name: Type check tests
        run: npm run tsc:test

      - name: Build
        run: npm run tsc:emit

      # Developers run tests with a real .env present (they copy .env.dev to .env). Prove the tests ignore it.
      - name: Use .env.dev as .env
        run: cp .env.dev .env

      - name: Test
        run: npm run test:coverage

      # .env.dev points DATABASE_URL at hennos.sqlite, which must never be created: tests use their own temp database.
      - name: Check tests did not touch the .env database
        run: |
          if find . -name 'hennos.sqlite*' -not -path './node_modules/*' | grep -q .; then
            echo "Tests used DATABASE_URL from .env"; find . -name 'hennos.sqlite*' -not -path './node_modules/*'; exit 1
          fi

      # Shown on the workflow run's summary page. Runs even when tests fail so partial coverage is still visible.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
